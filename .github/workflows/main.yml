name: Android CI Cloud Compiler Build Engine
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code Project Tree
      uses: actions/checkout@v4

    - name: Set up Java Production Development Runtime Environment
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Default Global Gradle Command Line Tools
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Build App Natively at Root Level
      run: gradle assembleDebug --no-daemon

    - name: Upload Completed App Package To Cloud Storage System Layout Channels
      uses: actions/upload-artifact@v4
      with:
        name: CustomChatApp-Installer-Package
        path: "**/build/outputs/apk/debug/*.apk"
